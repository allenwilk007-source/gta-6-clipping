<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload Queue</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/stats.css" />
    <link rel="stylesheet" href="/queue.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-left">
        <h1>Upload&nbsp;Queue</h1>
        <span class="game" id="updated">loading…</span>
      </div>
      <div class="bar-right">
        <a class="back-link" href="/">← Feed</a>
        <a class="back-link" href="/stats.html">Stats</a>
        <a class="back-link" href="/youtube.html">YouTube</a>
        <button type="button" id="refresh" class="refresh-btn">Refresh</button>
      </div>
    </header>

    <main class="stats-main">
      <p class="queue-caveat">
        These are projections, not promises. They follow the same cap and spacing
        rules the uploader actually applies — but a better-scoring short landing,
        a refusal, or switching a platform off all move them.
      </p>

      <section class="platform" id="youtube">
        <div class="platform-head">
          <h2>YouTube</h2>
          <span class="platform-state" id="youtube-state"></span>
        </div>
        <div class="platform-body" id="youtube-body"></div>
      </section>

      <section class="platform" id="tiktok">
        <div class="platform-head">
          <h2>TikTok</h2>
          <span class="platform-state" id="tiktok-state"></span>
        </div>
        <div class="platform-body" id="tiktok-body"></div>
      </section>

      <section class="platform" id="instagram">
        <div class="platform-head">
          <h2>Instagram</h2>
          <span class="platform-state" id="instagram-state"></span>
        </div>
        <div class="platform-body" id="instagram-body"></div>
      </section>
    </main>

    <script src="/queue.js" type="module"></script>
  </body>
</html>
